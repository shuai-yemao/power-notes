name: Validate and deploy Power Notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js directory.js note.js notes.js taxonomy.js; do
            node --check "$file"
          done

      - name: Validate static site entrypoints
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-static.mjs
          test -f dist/index.html
          test -f dist/library.html
          test -f dist/note.html
          test -f .openai/hosting.json
          test -f dist/sitemap.xml
          test -f dist/robots.txt

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: node scripts/build-static.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
